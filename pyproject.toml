[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-workbench"
version = "0.1.0"
description = "Local scikit-learn experiment workbench with MLflow tracking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
