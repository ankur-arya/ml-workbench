[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-workbench"
version = "0.2.0"
description = "Local-first classical ML workbench: evaluate, compare, promote. No Docker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=2.0",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
